<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Main Machine Container -->
  <rect x="100" y="200" width="600" height="300" rx="10" fill="#f0f0f0" stroke="#333" stroke-width="3"/>
  
  <!-- Feeders (7) -->
  <g id="feeders">
    <g id="feeder1" class="feeder" data-feeder="1">
      <rect x="150" y="150" width="50" height="80" rx="5" fill="#ddd" stroke="#333" stroke-width="2"/>
      <circle cx="175" cy="240" r="10" fill="#999" stroke="#333" stroke-width="1"/>
      <text x="175" y="180" text-anchor="middle" font-family="Arial" font-size="12">F1</text>
    </g>
    <g id="feeder2" class="feeder" data-feeder="2">
      <rect x="220" y="150" width="50" height="80" rx="5" fill="#ddd" stroke="#333" stroke-width="2"/>
      <circle cx="245" cy="240" r="10" fill="#999" stroke="#333" stroke-width="1"/>
      <text x="245" y="180" text-anchor="middle" font-family="Arial" font-size="12">F2</text>
    </g>
    <g id="feeder3" class="feeder" data-feeder="3">
      <rect x="290" y="150" width="50" height="80" rx="5" fill="#ddd" stroke="#333" stroke-width="2"/>
      <circle cx="315" cy="240" r="10" fill="#999" stroke="#333" stroke-width="1"/>
      <text x="315" y="180" text-anchor="middle" font-family="Arial" font-size="12">F3</text>
    </g>
    <g id="feeder4" class="feeder" data-feeder="4">
      <rect x="360" y="150" width="50" height="80" rx="5" fill="#ddd" stroke="#333" stroke-width="2"/>
      <circle cx="385" cy="240" r="10" fill="#999" stroke="#333" stroke-width="1"/>
      <text x="385" y="180" text-anchor="middle" font-family="Arial" font-size="12">F4</text>
    </g>
    <g id="feeder5" class="feeder" data-feeder="5">
      <rect x="430" y="150" width="50" height="80" rx="5" fill="#ddd" stroke="#333" stroke-width="2"/>
      <circle cx="455" cy="240" r="10" fill="#999" stroke="#333" stroke-width="1"/>
      <text x="455" y="180" text-anchor="middle" font-family="Arial" font-size="12">F5</text>
    </g>
    <g id="feeder6" class="feeder" data-feeder="6">
      <rect x="500" y="150" width="50" height="80" rx="5" fill="#ddd" stroke="#333" stroke-width="2"/>
      <circle cx="525" cy="240" r="10" fill="#999" stroke="#333" stroke-width="1"/>
      <text x="525" y="180" text-anchor="middle" font-family="Arial" font-size="12">F6</text>
    </g>
    <g id="feeder7" class="feeder" data-feeder="7">
      <rect x="570" y="150" width="50" height="80" rx="5" fill="#ddd" stroke="#333" stroke-width="2"/>
      <circle cx="595" cy="240" r="10" fill="#999" stroke="#333" stroke-width="1"/>
      <text x="595" y="180" text-anchor="middle" font-family="Arial" font-size="12">F7</text>
    </g>
  </g>
  
  <!-- Mixing Bowl -->
  <g id="mixer">
    <ellipse cx="400" cy="350" rx="150" ry="80" fill="#eee" stroke="#333" stroke-width="3"/>
    <ellipse cx="400" cy="350" rx="130" ry="65" fill="#ddd" stroke="#333" stroke-width="1"/>
    
    <!-- Mixer Blades (will be animated) -->
    <g id="mixerBlades">
      <line x1="340" y1="350" x2="460" y2="350" stroke="#555" stroke-width="8" stroke-linecap="round"/>
      <line x1="400" y1="290" x2="400" y2="410" stroke="#555" stroke-width="8" stroke-linecap="round"/>
    </g>
    
    <text x="400" y="450" text-anchor="middle" font-family="Arial" font-size="14">Mixer</text>
  </g>
  
  <!-- Water System -->
  <g id="waterSystem">
    <rect x="600" y="250" width="80" height="120" rx="5" fill="#d4f1f9" stroke="#333" stroke-width="2"/>
    <circle cx="640" cy="290" r="15" fill="#a8d5e5" stroke="#333" stroke-width="1"/>
    <rect x="625" y="310" width="30" height="10" fill="#8ec3d9" stroke="#333" stroke-width="1"/>
    <line x1="640" y1="320" x2="640" y2="340" stroke="#8ec3d9" stroke-width="5" stroke-linecap="round"/>
    <text x="640" y="380" text-anchor="middle" font-family="Arial" font-size="14">Water</text>
  </g>
  
  <!-- Scale/Load Cell -->
  <g id="scale">
    <rect x="350" y="440" width="100" height="10" fill="#999" stroke="#333" stroke-width="1"/>
    <rect x="370" y="450" width="60" height="20" fill="#777" stroke="#333" stroke-width="1"/>
    <text x="400" y="480" text-anchor="middle" font-family="Arial" font-size="14">Scale</text>
  </g>
  
  <!-- Status Indicators -->
  <g id="statusIndicators">
    <circle id="mixerStatus" cx="50" cy="350" r="10" fill="#ccc" stroke="#333" stroke-width="1"/>
    <text x="70" y="355" font-family="Arial" font-size="12">Mixer</text>
    
    <circle id="waterStatus" cx="50" cy="380" r="10" fill="#ccc" stroke="#333" stroke-width="1"/>
    <text x="70" y="385" font-family="Arial" font-size="12">Water</text>
    
    <circle id="heaterStatus" cx="50" cy="410" r="10" fill="#ccc" stroke="#333" stroke-width="1"/>
    <text x="70" y="415" font-family="Arial" font-size="12">Heater</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="80" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Teigwunderbar Machine</text>
  
  <!-- Real-time data display -->
  <g id="dataDisplay">
    <text id="weightDisplay" x="700" y="500" text-anchor="end" font-family="Arial" font-size="16">Weight: 0.0g</text>
    <text id="tempDisplay" x="700" y="530" text-anchor="end" font-family="Arial" font-size="16">Temp: 0.0°C</text>
    <text id="mixerSpeedDisplay" x="700" y="560" text-anchor="end" font-family="Arial" font-size="16">Mixer: 0/255</text>
  </g>
</svg> 